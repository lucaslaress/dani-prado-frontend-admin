name: dani_prado_frontend
description: "Sistema de PDV da loja Dani Prado."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.2

  # Navegação
  go_router: ^14.6.3

  # Estado global
  provider: ^6.1.2

  # Armazenamento local (salvar o token entre sessões)
  shared_preferences: ^2.3.3

  # Formatação de datas e valores monetários em pt-BR
  intl: ^0.20.2

  # Gráficos
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
