name: dani_prado_frontend
description: "Sistema de PDV da loja Dani Prado."
publish_to: 'none'

version: 1.0.0+9

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP
  http: ^1.2.2

  # Navegação
  go_router: ^14.6.3

  # Estado global
  provider: ^6.1.2

  # Armazenamento local (salvar o token entre sessões)
  shared_preferences: ^2.3.3

  # Formatação de datas e valores monetários em pt-BR
  intl: ^0.20.2

  # Gráficos
  fl_chart: ^0.70.0

  # Versão instalada do app (para checagem de atualização)
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Gera instalador .msix para Windows
  msix: ^3.16.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/app_icon.png

msix_config:
  display_name: Dani Prado
  publisher_display_name: Dani Prado
  publisher: CN=DaniPrado
  identity_name: com.daniprado.pdv
  msix_version: 1.0.9.0
  logo_path: assets/images/app_icon.png
  capabilities: internetClient
  languages: pt-BR
  certificate_path: dani_prado.pfx
  certificate_password: dani123
